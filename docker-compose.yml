# ============================================================================
# Mohkam — backend stack
#
#   api ──► pgbouncer ──► postgres (+pgvector)
#     │
#     ├──► redis (cache + BullMQ)
#     └──► minio (S3-compatible object storage)
#
#   worker ──► consumes BullMQ queues (AI, SMS, reminders, indexing)
#
# RUN IT (single command — no .env required, sane local defaults baked in):
#
#   docker compose up -d --build
#
# The API is then on http://localhost:9222  (override with API_PORT).
# MinIO console is on http://localhost:9001.
#
# Every value below has a local-dev default via ${VAR:-default}. For a real
# deployment, create a .env (see .env.example) with strong secrets, a public
# S3_PUBLIC_URL, and your real API keys — those defaults are NOT production-safe.
#
# Optional profiles (off by default):
#   docker compose --profile edge up -d           # Caddy TLS in front of the API
#   docker compose --profile observability up -d   # Prometheus + Grafana
# ============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: postgres://${POSTGRES_USER:-mohkam}:${POSTGRES_PASSWORD:-mohkam_local_dev}@pgbouncer:6432/${POSTGRES_DB:-mohkam}
  # Migrations and anything needing session-level features bypass the pooler.
  DATABASE_DIRECT_URL: postgres://${POSTGRES_USER:-mohkam}:${POSTGRES_PASSWORD:-mohkam_local_dev}@postgres:5432/${POSTGRES_DB:-mohkam}
  REDIS_URL: redis://:${REDIS_PASSWORD:-mohkam_local_dev}@redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-mohkam}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-mohkam}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-mohkam_local_dev}
  # Public host for presigned upload/download URLs — must be reachable by the
  # browser. Local default points at the published MinIO port on the host.
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
  # Local-dev fallback secrets. Override in .env for anything real.
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local_dev_access_secret_change_me_0123456789}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local_dev_refresh_secret_change_me_0123456789}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
  DOCUMENT_SHARE_SECRET: ${DOCUMENT_SHARE_SECRET:-local_dev_share_secret_change_me_0123456789}
  APP_URL: ${APP_URL:-http://localhost:9222}
  CORS_ORIGINS: ${CORS_ORIGINS:-*}
  AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
  AUTH_RATE_WINDOW: ${AUTH_RATE_WINDOW:-300}
  # --- AI (Novita, OpenAI-compatible) — empty = AI features return 503 ---
  NOVITA_API_KEY: ${NOVITA_API_KEY:-}
  AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-https://api.novita.ai/v3/openai}
  AI_MODEL: ${AI_MODEL:-meta-llama/llama-3.3-70b-instruct}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-baai/bge-m3}
  # --- Speech-to-text ---
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  # --- Telephony ---
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
  # --- Telemetry ---
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_SERVICE_NAME: mohkam-api
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  # ---------------------------------------------------------------- database
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mohkam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mohkam_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-mohkam}
      # Checksums catch silent corruption; cheap insurance on legal records.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=16MB
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=500
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mohkam} -d ${POSTGRES_DB:-mohkam}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "4", memory: 4G }

  # PgBouncer in transaction mode: thousands of app-side connections collapse
  # onto a small pool of real Postgres backends.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-mohkam}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mohkam_local_dev}
      DB_NAME: ${POSTGRES_DB:-mohkam}
      # The image defaults to 5432; 6432 keeps the pooler visibly distinct
      # from Postgres itself in URLs and logs.
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 5000
      DEFAULT_POOL_SIZE: 40
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 3
      SERVER_IDLE_TIMEOUT: 240
      QUERY_WAIT_TIMEOUT: 30
      # Prepared statements are unsupported in transaction pooling.
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-mohkam}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

  # ------------------------------------------------------------------- cache
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-mohkam_local_dev}
      - --maxmemory
      - 1gb
      # BullMQ job state must never be evicted — only volatile cache keys are.
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mohkam_local_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "2", memory: 1512M }

  # ---------------------------------------------------------------- storage
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # Published so browser presigned uploads/downloads (S3_PUBLIC_URL) work from
    # the host. 9000 = S3 API, 9001 = web console.
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mohkam}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mohkam_local_dev}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    # `edge` as well as `backend`: host port publishing (above) is impossible
    # from the internal-only `backend` network, and browsers need to reach the
    # presigned upload/download URLs directly.
    logging: *default-logging

  # One-shot: create the bucket and lock it down to private.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-mohkam} ${MINIO_ROOT_PASSWORD:-mohkam_local_dev} &&
      mc mb --ignore-existing local/${S3_BUCKET:-mohkam} &&
      mc anonymous set none local/${S3_BUCKET:-mohkam} &&
      mc version enable local/${S3_BUCKET:-mohkam} &&
      echo 'minio bucket ready'
      "
    restart: "no"

  # --------------------------------------------------------------------- api
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    # The API on the host. A fixed host port maps to one container, so the
    # default run is single-replica. To scale out, enable the `edge` profile
    # (Caddy fronts N replicas) and drop this published port.
    ports:
      - "${API_PORT:-9222}:3000"
    environment:
      <<: *api-env
      PORT: 3000
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      # Without this the bucket may not exist yet and every upload 404s.
      minio-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bun", "run", "healthcheck.ts"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    deploy:
      # Single replica by default (one host port). Scale behind Caddy via the
      # edge profile for production.
      replicas: 1
      resources:
        limits: { cpus: "2", memory: 1G }

  # Migrations run once, before any api/worker container accepts traffic.
  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["bun", "run", "src/db/migrate.ts"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    logging: *default-logging

  # ------------------------------------------------------------------ worker
  # Same image as the api — one dependency set, one build, different entrypoint.
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["bun", "src/worker/index.ts"]
    restart: unless-stopped
    # Longer than the api: a job mid-flight (document extraction, an AI call)
    # should be allowed to finish rather than be retried from scratch.
    stop_grace_period: 60s
    environment:
      <<: *api-env
      PORT: 3001
      OTEL_SERVICE_NAME: mohkam-worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    # `edge` too: the worker makes outbound calls to Novita, ElevenLabs and
    # Twilio, which the internal-only `backend` network cannot route.
    logging: *default-logging
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "2", memory: 1G }

  # ------------------------------------------------------------------- edge
  # Off by default (needs a real domain for ACME). Enable for production TLS +
  # load-balancing across scaled api replicas:
  #   docker compose --profile edge up -d
  caddy:
    image: caddy:2.9-alpine
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    logging: *default-logging

  # ----------------------------------------------------------- observability
  # Off by default: docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.3.0
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    logging: *default-logging


volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
